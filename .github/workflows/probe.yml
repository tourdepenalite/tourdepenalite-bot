name: probe-ibu
# Sonde temporaire (ticket #7) : s'execute au push d'une branche probe/*.
on:
  push:
    branches: ["probe/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -m tools.probe_ibu
