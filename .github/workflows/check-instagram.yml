name: check-instagram

# A lancer a la main apres avoir saisi IG_ACCESS_TOKEN : affiche l'ID du compte Instagram
# (a copier dans le secret IG_USER_ID) puis, une fois IG_USER_ID saisi, le quota de publication.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m tdp.check_instagram
